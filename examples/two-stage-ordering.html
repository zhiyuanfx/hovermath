<script>
"use strict";
const R = String.raw;

/* ==== CONTENT START ====
   hovermath demo page: a toy two-stage ordering model, written for this example.
   Everything between the CONTENT START and CONTENT END markers is the document; the rest of the file is the
   hovermath engine. The format is described in references/format.md of the hovermath skill. */

const DOC = {
  title: "A Two-Stage Ordering Model",
  short: "Two-stage ordering (demo)",
  eyebrow: "hovermath demo page",
  authors: "A toy model written for this example",
  source: "Example for the hovermath skill",
  links: [],
  note: R`Hover any symbol to see what it means, and click it to pin the definition. Hover an equation number such as (1c), or the model's name (TS), to preview it. Each group of equations is followed by its explanation: a gray bar marks an explanation from the source and a colored bar one that was added while making the page.`,
  footer: "Made with hovermath. Math rendered with KaTeX.",
};

const KINDS = {
  set:  { label: "Set", color: "purple" },
  idx:  { label: "Index" },
  par:  { label: "Parameter" },
  rnd:  { label: "Uncertain demand", color: "orange" },
  st1:  { label: "First-stage decision", color: "blue" },
  st2:  { label: "Second-stage decision", color: "green" },
  fn:   { label: "Computed value" },
};

const SYM = {
  S:  { tex: R`\mathcal S`, kind: "set", def: R`Set of demand scenarios, indexed by \(s\).`, ref: "notation" },
  s:  { tex: R`s`, kind: "idx", def: R`Demand scenario, \(s\in\mathcal S\).`, ref: "notation" },
  c:  { tex: R`c`, kind: "par", dom: R`c>0`, def: R`Unit cost of the regular order, placed before demand is known.`, ref: "notation" },
  r:  { tex: R`r`, kind: "par", dom: R`r>c`, def: R`Unit cost of a rush order, placed after demand is known.`, ref: "notation" },
  p:  { tex: R`p`, kind: "par", dom: R`p>r`, def: R`Selling price per unit.`, ref: "notation" },
  Y:  { tex: R`Y`, kind: "par", dom: R`Y\ge0`, def: R`Largest rush order the supplier accepts.`, ref: "notation" },
  pi: { tex: R`\pi_s`, kind: "par", dom: R`\pi_s\ge0,\ \sum_{s}\pi_s=1`, def: R`Probability of scenario \(s\).`, ref: "notation" },
  d:  { tex: R`d_s`, kind: "rnd", dom: R`d_s>0`, def: R`Demand in scenario \(s\), in units.`, ref: "notation" },
  x:  { tex: R`x`, kind: "st1", dom: R`x\ge0`, def: R`Regular order: units ordered before demand is known. The same in every scenario.`, ref: "notation" },
  y:  { tex: R`y_s`, kind: "st2", dom: R`0\le y_s\le Y`, def: R`Rush order in scenario \(s\): units ordered after demand is known.`, ref: "notation" },
  z:  { tex: R`z_s`, kind: "st2", dom: R`z_s\ge0`, def: R`Units sold in scenario \(s\).`, ref: "notation" },
  FR: { tex: R`\mathrm{FR}`, word: "FR", kind: "fn", dom: R`\mathrm{FR}\in[0,1]`, def: R`Fill rate (2): the expected share of demand that is served.`, ref: "service" },
};

const SECTIONS = [
  { id: "setting", num: "1", title: "Setting", blocks: [
    { p: R`A seller stocks one product for one selling day. The regular order \({{x}}\) is placed before the day's demand is known. Demand \({{d}}\) is then revealed as one of a few scenarios. After that, the seller may place a rush order \({{y}}\) at a higher unit cost, up to a limit, and sells \({{z}}\) units. Unsold units are worth nothing.` },
    { fig: { n: "1", src: "figures/fig01.svg", width: "34em", cap: R`Order of events. The regular order \({{x}}\) is fixed before demand \({{d}}\) is known; the rush order \({{y}}\) and the sales \({{z}}\) adapt to it.` } },
  ]},
  { id: "notation", num: "2", title: "Notation", blocks: [
    { nomen: [
      { title: "Sets and indices", keys: ["S", "s"] },
      { title: "Parameters", keys: ["c", "r", "p", "Y", "pi"] },
      { title: "Uncertain demand", keys: ["d"] },
      { title: "Decisions", keys: ["x", "y", "z"] },
    ]},
  ]},
  { id: "model", num: "3", title: "Model", blocks: [
    { p: R`The two-stage model (TS) chooses the regular order that maximizes expected profit.` },
    { id: "TS", eqs: [
      { tag: "1a", tex: R`\text{(TS)}\quad\max\ -{{c}}{{x}}+\sum_{{{s}}\in{{S}}}{{pi}}\,({{p}}{{z}}-{{r}}{{y}})` },
      { expl: R`(1a) Expected profit: the regular order is paid for in every scenario, while sales revenue and rush-order cost depend on the scenario.` },
      { tag: "1b", tex: R`{{z}}\le{{d}},\quad\forall{{s}}\in{{S}}` },
      { tag: "1c", tex: R`{{z}}\le{{x}}+{{y}},\quad\forall{{s}}\in{{S}}` },
      { expl: R`(1b)–(1c) Sales cannot exceed demand, and cannot exceed the units on hand: the regular order plus the rush order.` },
      { tag: "1d", tex: R`{{y}}\le{{Y}},\quad\forall{{s}}\in{{S}}` },
      { expl: R`(1d) The rush order is limited.` },
      { tag: "1e", tex: R`{{x}}\ge0,\quad{{y}},{{z}}\ge0,\quad\forall{{s}}\in{{S}}` },
      { expl: R`Only \({{x}}\) has no scenario index: it is decided once, before demand is known. \({{y}}\) and \({{z}}\) have one copy per scenario because they are decided afterwards.`, added: true },
    ]},
    { note: R`Because \({{p}}>{{r}}\), a rush unit that can be sold is always worth ordering. So for a given \({{x}}\), the second stage is solved by inspection: \(\sym{y}{y_s}=\min\{\max\{{{d}}-{{x}},0\},{{Y}}\}\) and \(\sym{z}{z_s}=\min\{{{d}},{{x}}+{{y}}\}\).` },
  ]},
  { id: "service", num: "4", title: "A Measure of Service", blocks: [
    { p: R`The fill rate FR summarizes how much of the demand a plan serves:` },
    { eqs: [
      { tag: "2", tex: R`{{FR}}=\sum_{{{s}}\in{{S}}}{{pi}}\,\frac{{{z}}}{{{d}}}` },
      { expl: R`(2) The share of demand served in each scenario, averaged with the scenario probabilities. FR is 1 when every scenario's demand is fully served.` },
    ]},
  ]},
  { id: "plans", num: "5", title: "Comparing Plans", blocks: [
    { p: R`Take \({{c}}=4\), \({{r}}=7\), \({{p}}=10\), \({{Y}}=20\) and three scenarios: demand 60, 100 or 140 with probabilities 0.3, 0.5 and 0.2. Table 1 evaluates (1a) and (2) for five regular orders, with the second stage chosen as in the note above.` },
    { table: { no: "TABLE 1", title: "Expected profit and FR of five regular orders", cls: "num",
      head: [[R`Regular order \({{x}}\)`, "Expected profit", "FR"]], rows: [
        ["60", "402", "0.814"],
        ["80", "462", "0.943"],
        ["100", "492", "0.971"],
        ["120", "452", "1.000"],
        ["140", "400", "1.000"],
      ]}},
    { p: R`Expected profit is highest at \({{x}}=100\). Ordering more raises FR to 1 but lowers expected profit, because the extra units are needed only in the high-demand scenario.` },
  ]},
];
/* ==== CONTENT END ==== */

/* ---------------- Rendering ---------------- */
const MACROS = { "\\sym": "\\htmlData{sym=#1}{#2}" };
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const EQ = {};
const PROBLEMS = [];
const problem = (msg) => { if (!PROBLEMS.includes(msg)) PROBLEMS.push(msg); console.error(msg); };

function prep(tex, live) {
  let out = tex.replace(/\{\{(\w+)\}\}/g, (m, k) => {
    const s = SYM[k];
    if (!s) { problem("Unknown symbol key: " + k); return m; }
    return live ? `\\sym{${k}}{${s.tex}}` : `{${s.tex}}`;
  });
  if (!live) out = out.replace(/\\sym\{\w+\}/g, "");
  return out;
}
function tex2html(tex, display, live = true) {
  try {
    return katex.renderToString(prep(tex, live), {
      displayMode: display, fleqn: display, throwOnError: true, strict: "ignore",
      trust: (c) => c.command === "\\htmlData", macros: { ...MACROS },
    });
  } catch (err) {
    problem("Formula does not render: " + tex.slice(0, 80) + " (" + String(err.message || err).slice(0, 120) + ")");
    return `<span class="tex-error">${esc(tex)}</span>`;
  }
}
function linkify(h) {
  return h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, href) =>
    `<a href="${href}"${/^https?:|\.pdf/.test(href) ? ' target="_blank" rel="noopener"' : ""}>${text}</a>`);
}
/* Everything the author defines is hoverable, not only math symbols. A name the source defines and the text
   writes as a plain word (an index such as TF, a case label such as B0) is a SYM entry with `word: "TF"`,
   or a list of words, and is hoverable wherever the word appears in prose, table cells and captions.
   General abbreviations of the field are not defined by the source and get no entry.
   Tags are skipped, so attributes are never touched. */
const WORDS = Object.fromEntries(Object.entries(SYM).flatMap(([k, s]) => [].concat(s.word || []).map((w) => [w, k])));
const WORD_RE = Object.keys(WORDS).length ? new RegExp("(^|[^\\w-])(" + Object.keys(WORDS)
  .sort((a, b) => b.length - a.length).map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")(?![\\w-])", "g") : null;
function markWords(h) {
  if (!WORD_RE) return h;
  return h.split(/(<[^>]+>)/).map((seg) => seg.startsWith("<") ? seg :
    seg.replace(WORD_RE, (m, pre, w) => `${pre}<span class="term" data-sym="${WORDS[w]}">${w}</span>`)).join("");
}
function rich(str, live = true) {
  return str.split(/(\\\([\s\S]+?\\\))/g).map((part) => {
    if (part.startsWith("\\(") && part.endsWith("\\)")) return tex2html(part.slice(2, -2), false, live);
    let h = linkify(esc(part).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"));
    if (live) h = markWords(h.replace(/\(([A-Za-z0-9][\w.'*-]{0,15})\)/g, (m, id) =>
      EQ[id] ? `<a class="eqref" href="#${EQ[id].anchor}" data-eq="${id}">(${id})</a>` : m));
    return h;
  }).join("");
}

function eachBlock(fn) {
  for (const s of SECTIONS) {
    (s.blocks || []).forEach(fn);
    (s.subs || []).forEach((u) => u.blocks.forEach(fn));
  }
}
function collectEqs() {
  const groups = {};
  eachBlock((b) => {
    if (!b.eqs) return;
    if (b.id) EQ[b.id] = { rows: b.eqs.filter((r) => r.tex), anchor: `eq-${b.id}` };
    for (const r of b.eqs) {
      if (!r.tag) continue;
      EQ[r.tag] = { rows: [r], anchor: `eq-${r.tag}` };
      const g = r.tag.match(/^(.*\d)[a-z]$/);
      if (g) (groups[g[1]] = groups[g[1]] || []).push(r);
    }
  });
  for (const [g, rows] of Object.entries(groups)) if (!EQ[g]) EQ[g] = { rows, anchor: `eq-${rows[0].tag}` };
}

function figHTML(f) {
  const src = IMAGES[f.src] || f.src;
  const label = f.label !== undefined ? f.label : (f.n ? `Fig. ${f.n}.` : "");
  const size = f.width ? ` style="width:${esc(f.width)}"`
    : ` onload="this.style.width=(this.naturalWidth/${8 * Number(f.zoom || DOC.figZoom || 3)})+'em'"`;
  return `<figure class="hm-fig"${f.n ? ` id="fig-${esc(String(f.n))}"` : ""}><div class="fig-img"><img src="${esc(src)}" alt="${esc(label || "Figure")}" loading="lazy"${size}` +
    ` onerror="this.closest('figure').classList.add('missing')"></div>` +
    `<div class="fig-missing">Image not found: <code>${esc(f.src)}</code>.</div>` +
    `<figcaption>${label ? `<span class="fig-no">${esc(label)}</span>` : ""}${rich(f.cap || "")}</figcaption></figure>`;
}
function explHTML(b) {
  return b.added ? `<p class="expl added" title="Explanation added by us, not from the source">${rich(b.expl)}</p>`
    : `<p class="expl">${rich(b.expl)}</p>`;
}
function eqsHTML(b) {
  const rows = b.eqs.map((r) => r.expl ? explHTML(r) : `<div class="eqrow"${r.tag ? ` id="eq-${r.tag}"` : ""}>` +
    `<div class="f">${tex2html(r.tex, true)}</div><span class="eqtag">${r.tag ? `(${r.tag})` : ""}</span></div>`).join("");
  return `<div class="eqs"${b.id ? ` id="eq-${b.id}"` : ""}>${rows}</div>`;
}
function cellHTML(c, tag) {
  if (typeof c === "string") return `<${tag}>${rich(c)}</${tag}>`;
  return `<${tag}${c.cs ? ` colspan="${c.cs}" class="grp"` : ""}${c.rs ? ` rowspan="${c.rs}"` : ""}>${rich(c.t)}</${tag}>`;
}
function tableHTML(t) {
  const cap = t.no || t.title ? `<figcaption>${t.no ? `<span class="tbl-no">${esc(t.no)}</span>` : ""}${t.title ? rich(t.title) : ""}</figcaption>` : "";
  return `<figure class="tblfig">${cap}<div class="tbl-wrap"><table class="tbl ${t.cls || ""}"><thead>` +
    t.head.map((row) => `<tr>${row.map((c) => cellHTML(c, "th")).join("")}</tr>`).join("") + `</thead><tbody>` +
    t.rows.map((row) => `<tr>${row.map((c) => cellHTML(c, "td")).join("")}</tr>`).join("") + `</tbody></table></div></figure>`;
}
function blocksHTML(blocks) {
  return blocks.map((b) => {
    if (b.eqs) return eqsHTML(b);
    if (b.table) return tableHTML(b.table);
    if (b.note) return `<aside class="rnote"><span class="rnote-tag">${esc(b.label || "Reader's note")}</span>${rich(b.note)}</aside>`;
    if (b.fig) return figHTML(b.fig);
    if (b.kw) return `<p class="kw"><strong>${esc(b.label || "Keywords")}</strong> — ${esc(b.kw)}</p>`;
    if (b.hint) return `<p class="hint">${rich(b.hint)}</p>`;
    if (b.nomen) return b.nomen.map((g) => `<h4 class="nom">${esc(g.title)}</h4><div class="tbl-wrap"><table class="tbl"><tbody>` +
      g.keys.map((k) => `<tr><td style="width:9em">${tex2html(`{{${k}}}`, false)}</td><td>${rich(SYM[k].def)}</td></tr>`).join("") +
      `</tbody></table></div>`).join("");
    if (b.expl) return explHTML(b);
    if (b.ul || b.ol) {
      const tag = b.ul ? "ul" : "ol";
      return `<${tag} class="rules">${(b.ul || b.ol).map((t) => `<li>${rich(t)}</li>`).join("")}</${tag}>`;
    }
    return `<p class="para">${rich(b.p)}</p>`;
  }).join("");
}

function glossaryHTML() {
  let h = `<h2 class="sec" id="glossary"><span>Symbol glossary</span></h2>
    <p class="hint">Every symbol and defined term on this page, by kind.</p>`;
  for (const kind of Object.keys(KINDS)) {
    const keys = Object.keys(SYM).filter((k) => SYM[k].kind === kind);
    if (!keys.length) continue;
    h += `<article class="card"><div class="card-head"><h3 class="card-title">${esc(KINDS[kind].label)}</h3></div><div class="tbl-wrap"><table class="tbl"><tbody>` +
      keys.map((k) => `<tr><td style="width:9em">${tex2html(`{{${k}}}`, false)}</td><td>${rich(SYM[k].def)}${SYM[k].dom ? `<div class="hint">${tex2html(SYM[k].dom, false, false)}</div>` : ""}</td></tr>`).join("") +
      `</tbody></table></div></article>`;
  }
  return h;
}

function buildContent() {
  const linkHTML = (l) => `<a class="btn-link" href="${esc(l.href)}"${/^https?:/.test(l.href) ? ' target="_blank" rel="noopener"' : ""}>${esc(l.label)}</a>`;
  let h = `<header id="overview">` +
    (DOC.eyebrow ? `<p class="eyebrow">${esc(DOC.eyebrow)}</p>` : "") +
    `<h1>${esc(DOC.title)}</h1>` +
    (DOC.authors ? `<p class="byline">${esc(DOC.authors)}</p>` : "") +
    (DOC.source ? `<p class="venue">${rich(DOC.source)}</p>` : "") +
    ((DOC.links || []).length ? `<div class="links">${DOC.links.map(linkHTML).join("")}</div>` : "") +
    (DOC.note ? `<p class="callout">${rich(DOC.note)}</p>` : "") + `</header>`;
  for (const s of SECTIONS) {
    h += `<h2 class="sec" id="${s.id}">${s.num ? `<span class="secnum">${esc(s.num)}.</span>` : ""}<span>${esc(s.title)}</span></h2>`;
    if (s.blocks) h += `<article class="card">${blocksHTML(s.blocks)}</article>`;
    for (const u of s.subs || []) {
      h += `<article class="card" id="${u.id}"><div class="card-head">${u.num ? `<span class="tag">${esc(u.num)}</span>` : ""}` +
        `<h3 class="card-title">${esc(u.title)}</h3></div>${blocksHTML(u.blocks)}</article>`;
    }
  }
  h += glossaryHTML();
  if (DOC.footer) h += `<footer class="foot">${rich(DOC.footer)}</footer>`;
  if (PROBLEMS.length) h = `<div class="hm-problems"><strong>This page has ${PROBLEMS.length} problem(s) to fix:</strong><ul>` +
    PROBLEMS.map((p) => `<li>${esc(p)}</li>`).join("") + `</ul></div>` + h;
  return h;
}

function buildToc() {
  const items = [{ id: "overview", label: "Overview" },
    ...SECTIONS.map((s) => ({ id: s.id, label: (s.num ? s.num + ". " : "") + s.title,
      sub: (s.subs || []).map((u) => ({ id: u.id, label: (u.num ? u.num + " " : "") + u.title })) })),
    { id: "glossary", label: "Symbol glossary" }];
  const link = (it) => `<a href="#${it.id}" data-target="${it.id}">${esc(it.label)}</a>`;
  document.getElementById("toc-list").innerHTML = items.map((it) =>
    `<li>${link(it)}${it.sub && it.sub.length ? `<ol>${it.sub.map((s) => `<li>${link(s)}</li>`).join("")}</ol>` : ""}</li>`).join("");
  document.getElementById("toc-title").textContent = DOC.short || DOC.title;
  document.title = DOC.short || DOC.title;
  return items.flatMap((it) => [it.id, ...(it.sub || []).map((s) => s.id)]);
}

function buildLegend() {
  const used = new Set(Object.values(SYM).map((s) => s.kind));
  const row = (cls, color, label) => `<div class="lg"><span class="${cls}" style="background:${color}"></span>${esc(label)}</div>`;
  const kinds = Object.entries(KINDS).filter(([k]) => used.has(k));
  let h = kinds.filter(([, v]) => v.color).map(([, v]) => row("sw", `var(--c-${v.color})`, v.label)).join("");
  if (h && kinds.some(([, v]) => !v.color)) h += row("sw", "var(--ink)", "Other symbols");
  if (document.querySelector("#content .expl:not(.added)")) h += row("sw bar", "var(--bar-source)", "Explanation from the source");
  if (document.querySelector("#content .expl.added")) h += row("sw bar", "var(--c-added)", "Explanation added by us");
  document.getElementById("legend").innerHTML = h;
}

/* ---------------- Interaction ---------------- */
const tip = document.getElementById("tip");
const content = document.getElementById("content");
let curEl = null, pinned = false, hideTimer = 0;

/* KaTeX lays transparent boxes over fractions and summation limits, so the topmost element under
   the pointer is often not the symbol. Look through the whole stack and take the first glyph that
   belongs to a symbol, or the first equation-number link. */
const hasText = (n) => { for (const c of n.childNodes) if (c.nodeType === 3 && c.nodeValue.trim()) return true; return false; };
function targetFrom(stack) {
  for (const n of stack) {
    if (n === tip || tip.contains(n)) return null;
    if (!content.contains(n)) continue;
    const a = n.closest("a.eqref");
    if (a) return a;
    if (!hasText(n)) continue;
    const s = n.closest("[data-sym]");
    if (s) return s;
  }
  return null;
}

function symTipHTML(key) {
  const s = SYM[key];
  const kind = KINDS[s.kind] || { label: s.kind };
  return `<div class="tip-head"><span class="tip-sym" data-color="${kind.color || ""}">${tex2html(s.tex, false, false)}</span>
    <span class="badge" data-color="${kind.color || ""}">${esc(kind.label)}</span>
    <button class="tip-close" type="button" aria-label="Close">×</button></div>
    <div class="tip-def">${rich(s.def, false)}</div>
    ${s.dom ? `<div class="tip-dom">${tex2html(s.dom, false, false)}</div>` : ""}
    <div class="tip-foot">${s.ref ? `<a class="tip-ref" href="#${s.ref}">Where it is defined →</a>` : ""}<span class="tip-hint">Click to pin</span></div>`;
}
function eqTipHTML(id) {
  const e = EQ[id];
  return `<div class="tip-head"><span class="badge">Equation (${esc(id)})</span></div><div class="tip-eq">` +
    e.rows.map((r) => `<div class="eqrow"><div class="f">${tex2html(r.tex, true, false)}</div><span class="eqtag">${r.tag ? `(${r.tag})` : ""}</span></div>`).join("") +
    `</div><div class="tip-foot"><span class="tip-hint">Click the number to jump there</span></div>`;
}
function place(el) {
  const r = el.getBoundingClientRect();
  tip.style.left = "0px"; tip.style.top = "0px";
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const left = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, innerWidth - tw - 8));
  let top = r.bottom + 10;
  if (top + th > innerHeight - 8) top = r.top - th - 10;
  tip.style.left = left + "px"; tip.style.top = Math.max(8, top) + "px";
}
function clearMarks() {
  document.querySelectorAll("#content .same, #content .cur").forEach((n) => n.classList.remove("same", "cur"));
}
function show(el) {
  const key = el.dataset.sym, eq = el.dataset.eq;
  if (key ? !SYM[key] : !EQ[eq]) return;
  if (curEl !== el) {
    clearMarks();
    if (key) {
      document.querySelectorAll(`#content [data-sym="${key}"]`).forEach((n) => n.classList.add("same"));
      el.classList.add("cur");
      tip.innerHTML = symTipHTML(key);
      tip.classList.remove("eq");
    } else {
      tip.innerHTML = eqTipHTML(eq);
      tip.classList.add("eq");
    }
    curEl = el;
  }
  tip.hidden = false;
  content.classList.toggle("on-sym", !!key);
  place(el);
}
function hide() {
  clearTimeout(hideTimer); hideTimer = 0;
  tip.hidden = true; tip.classList.remove("pinned"); pinned = false; curEl = null; clearMarks();
  content.classList.remove("on-sym");
}
function pin() { pinned = true; tip.classList.add("pinned"); }

function wire(spyIds) {
  document.querySelectorAll("#content [data-sym]").forEach((el) => {
    const s = SYM[el.dataset.sym];
    if (s && KINDS[s.kind]) { el.dataset.kind = s.kind; if (KINDS[s.kind].color) el.dataset.color = KINDS[s.kind].color; }
  });

  let raf = 0, lastXY = [0, 0];
  function onMove() {
    raf = 0;
    if (pinned) return;
    const el = targetFrom(document.elementsFromPoint(lastXY[0], lastXY[1]));
    if (el) { clearTimeout(hideTimer); hideTimer = 0; show(el); }
    else if (curEl && !hideTimer) hideTimer = setTimeout(() => { hideTimer = 0; if (!pinned) hide(); }, 140);
  }
  document.addEventListener("mousemove", (e) => {
    lastXY = [e.clientX, e.clientY];
    if (!raf) raf = requestAnimationFrame(onMove);
  }, { passive: true });
  document.documentElement.addEventListener("mouseleave", () => { if (!pinned) hide(); });
  document.addEventListener("click", (e) => {
    if (e.target.closest(".tip-ref") || e.target.closest(".tip-close")) { hide(); return; }
    if (e.target.closest("#tip")) return;
    if (e.target.closest("a.eqref")) { hide(); return; }
    const el = targetFrom(document.elementsFromPoint(e.clientX, e.clientY));
    if (el && el.dataset.sym) {
      if (pinned && curEl === el) { hide(); return; }
      pinned = false; tip.classList.remove("pinned");
      show(el); pin(); return;
    }
    if (pinned) hide();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hide(); });
  addEventListener("scroll", () => { if (curEl) { if (pinned) place(curEl); else hide(); } spy(); }, { passive: true });
  addEventListener("resize", () => { if (curEl) hide(); });

  const links = [...document.querySelectorAll("#toc-list a")];
  function spy() {
    let cur = spyIds[0];
    for (const id of spyIds) {
      const el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top <= 140) cur = id;
    }
    links.forEach((a) => a.classList.toggle("active", a.dataset.target === cur));
  }
  spy();

  // Viewer preferences (optional): contents panel, theme, text size and symbol colors.
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

  /* Contents panel. Narrow screens: a top bar whose Contents button opens the list. Wide screens: a side
     panel that the minimize button turns into the same top bar; Contents then brings the side panel back. */
  const nav = document.getElementById("toc"), btn = document.getElementById("toc-toggle");
  const wide = matchMedia("(min-width: 901px)");
  function setMin(min) {
    // Keep the reader's place: the layout change moves the text.
    let anchor = null;
    for (const el of content.querySelectorAll("h2.sec, .card > *")) {
      if (el.getBoundingClientRect().bottom > 80) { anchor = el; break; }
    }
    const before = anchor ? anchor.getBoundingClientRect().top : 0;
    document.body.classList.toggle("toc-min", min);
    if (anchor) scrollBy({ top: anchor.getBoundingClientRect().top - before, behavior: "instant" });
    store.set("hovermath-toc", min ? "min" : "side");
    btn.setAttribute("aria-expanded", !min);
    hide(); spy();
  }
  document.getElementById("toc-min").addEventListener("click", () => setMin(true));
  btn.addEventListener("click", () => {
    if (wide.matches) { setMin(false); return; }
    const open = nav.classList.toggle("open"); btn.setAttribute("aria-expanded", open);
  });
  links.forEach((a) => a.addEventListener("click", () => { nav.classList.remove("open"); if (!wide.matches) btn.setAttribute("aria-expanded", false); }));
  if (store.get("hovermath-toc") === "min") { document.body.classList.add("toc-min"); btn.setAttribute("aria-expanded", false); }
  // Anchors stop below the top bar: keep its height in --bar-h (not while the Contents list is open).
  new ResizeObserver(() => {
    if (!nav.classList.contains("open")) document.documentElement.style.setProperty("--bar-h", nav.offsetHeight + "px");
  }).observe(nav);
  const themeBtns = [...document.querySelectorAll("[data-theme-set]")];
  function setTheme(t, save = true) {
    document.documentElement.dataset.theme = t;
    themeBtns.forEach((b) => b.setAttribute("aria-pressed", b.dataset.themeSet === t));
    if (save) store.set("hovermath-theme", t);
  }
  themeBtns.forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.themeSet)));
  // First visit: follow the system setting. After that, the reader's choice.
  const savedTheme = store.get("hovermath-theme");
  setTheme(savedTheme === "light" || savedTheme === "dark" ? savedTheme
    : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light", false);
  const SIZES = [1, 1.125, 1.25, 1.375, 1.5, 1.625, 1.75, 2];
  const sizeVal = document.getElementById("size-val");
  const sizeDown = document.getElementById("size-down"), sizeUp = document.getElementById("size-up");
  let zi = SIZES.indexOf(Number(store.get("hovermath-size")));
  if (zi < 0) zi = SIZES.indexOf(1.375);
  function setSize(i) {
    zi = Math.max(0, Math.min(SIZES.length - 1, i));
    document.documentElement.style.setProperty("--z", SIZES[zi]);
    sizeVal.textContent = Math.round(SIZES[zi] * 100) + "%";
    sizeDown.disabled = zi === 0; sizeUp.disabled = zi === SIZES.length - 1;
    store.set("hovermath-size", String(SIZES[zi]));
    hide(); spy();
  }
  sizeDown.addEventListener("click", () => setSize(zi - 1));
  sizeUp.addEventListener("click", () => setSize(zi + 1));
  setSize(zi);

  const colorBox = document.getElementById("color-toggle");
  colorBox.checked = store.get("hovermath-color") !== "off";
  document.body.classList.toggle("mono", !colorBox.checked);
  colorBox.addEventListener("change", () => {
    document.body.classList.toggle("mono", !colorBox.checked);
    store.set("hovermath-color", colorBox.checked ? "on" : "off");
  });
}

if (typeof katex === "undefined") {
  document.getElementById("content").innerHTML =
    "<p>Math rendering needs an internet connection: KaTeX loads from cdn.jsdelivr.net. " +
    "An offline copy of this page can be made with hovermath's make_offline script.</p>";
} else {
  for (const [k, sy] of Object.entries(SYM)) {
    if (!KINDS[sy.kind]) problem(`Symbol ${k} has kind "${sy.kind}", which is not in KINDS`);
    if (sy.ref && !SECTIONS.some((x) => x.id === sy.ref || (x.subs || []).some((u) => u.id === sy.ref)))
      problem(`Symbol ${k} points to section "${sy.ref}", which does not exist`);
  }
  collectEqs();
  document.getElementById("content").innerHTML = buildContent();
  const spyIds = buildToc();
  buildLegend();
  wire(spyIds);
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}
</script>
</body>
</html>
